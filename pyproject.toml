[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-pocket"
version = "0.1.0"
description = "A from-scratch compact language model and local evidence workbench"
requires-python = ">=3.10"
dependencies = ["torch>=2.7,<3", "numpy>=1.24", "tokenizers>=0.21,<0.23", "datasets>=3,<5"]

[project.optional-dependencies]
test = ["pytest>=8"]
eval = ["lm-eval>=0.4.9,<0.5", "transformers>=4.51,<5", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["odin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
